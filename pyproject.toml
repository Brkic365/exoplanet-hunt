[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exohunt"
version = "0.1.0"
description = "End-to-end TESS transit search: ingest, detrend, search, vet, classify."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "astropy",
  "astroquery",
  "requests",
  "wotan",
  "transitleastsquares",
  "matplotlib",
  "scipy",
  "numba",
  "batman-package",
]

[project.optional-dependencies]
dev = ["pytest"]
ml = ["torch", "scikit-learn"]  # classifier (week 3)
gpu = ["numba-cuda[cu12]", "numpy<2.5"]  # numba-cuda 0.30 still calls np.row_stack (removed in numpy 2.5)  # CUDA BLS kernel; needs an NVIDIA GPU + driver

[project.scripts]
exohunt = "exohunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
